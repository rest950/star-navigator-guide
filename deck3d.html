<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#cfdde6">
<title>探索星號 3D 甲板</title>
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<!--
  探索星號 3D 甲板模型（導覽站的附屬頁，入口在「更多」選單、桌機 header、各 Deck 平面圖）
  - 名稱與位置以官方台灣出發版手冊第 7–10 頁為準，設施名稱跟 index.html 的 D 一致；改 D 的名稱要同步這裡
  - 座標是手冊甲板圖的像素位置換算；示意模型，非比例尺
  - three.js r128 放在 vendor/three/（MIT），不走 CDN：船上沒網路也要能開，sw.js 的 SHELL 有列
  - #<n> 開啟時直接聚焦該層（例：deck3d.html#10）
-->
<style>
/* Layout: full-screen 3D stage; title + view toggles on top, deck "elevator" panel on the right, legend bottom-left, info card bottom-right */
:root{
  --sea:#cfdde6; --ink:#14263a; --ink-soft:#4b5d70;
  --panel:rgba(255,255,255,.9); --line:rgba(20,38,58,.14); --accent:#c8202f;
  --font:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sea);color:var(--ink);font-family:var(--font);overflow:hidden}
#stage{position:fixed;inset:0;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;cursor:grab}
#labels{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.lb{position:absolute;transform:translate(-50%,-100%);white-space:nowrap;font-size:12px;font-weight:500;
  color:var(--ink);background:rgba(255,255,255,.85);padding:2px 7px;border-radius:4px;border:1px solid var(--line)}
.lb.deck{font-size:13px;font-weight:700;color:#fff;background:var(--accent);border:0;transform:translate(-100%,-50%)}
.lb.bow{background:var(--ink);color:#fff;border:0}
.lb.core{font-size:11px;padding:1px 5px;color:#fff;border:0}
.lb.core.stairs{background:#c98a00}
.lb.core.lift{background:#1e6fb8}
#tip{position:fixed;z-index:6;pointer-events:none;background:var(--ink);color:#fff;font-size:13px;font-weight:500;
  padding:4px 9px;border-radius:5px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.2)}
#tip small{font-weight:400;opacity:.75;margin-left:6px;font-size:11px}
.bar{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));
  display:flex;flex-wrap:wrap;gap:10px;align-items:center;pointer-events:none}
.bar>*{pointer-events:auto}
h1{margin:0 8px 0 0;font-size:20px;font-weight:700;color:var(--accent);letter-spacing:.04em}
.grp{display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);padding:4px;border-radius:8px;border:1px solid var(--line);backdrop-filter:blur(6px)}
button{font:inherit;font-size:13px;border:0;background:transparent;color:var(--ink);padding:6px 11px;border-radius:5px;cursor:pointer}
button:hover{background:rgba(20,38,58,.07)}
button[aria-pressed="true"]{background:var(--ink);color:#fff}
.back{font-size:13px;font-weight:500;color:#fff;background:var(--ink);text-decoration:none;padding:7px 12px;border-radius:8px;white-space:nowrap}
.back:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.info a{color:var(--accent);font-weight:500}
.legend .src{font-size:11px;color:var(--ink-soft);margin:8px 0 0;line-height:1.5}
button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--ink-soft);background:var(--panel);padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
.decks{position:fixed;z-index:5;right:max(16px,env(safe-area-inset-right,0px));top:calc(70px + env(safe-area-inset-top,0px));
  display:flex;flex-direction:column;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px;backdrop-filter:blur(6px)}
.decks button{text-align:left;min-width:64px;font-variant-numeric:tabular-nums}
.legend{position:fixed;left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font-size:12px;backdrop-filter:blur(6px);max-width:calc(100vw - 32px)}
.legend summary{cursor:pointer;color:var(--ink-soft);font-weight:500}
.legend .g{display:grid;grid-template-columns:repeat(2,auto);gap:5px 14px;margin-top:6px}
.legend b{grid-column:1/-1;font-size:12px;color:var(--ink-soft);font-weight:500;margin-top:4px}
.sw{display:flex;align-items:center;gap:6px}
.sw i{width:11px;height:11px;border-radius:2px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.info{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));
  width:min(270px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:8px;
  padding:12px 14px;backdrop-filter:blur(6px)}
.info .t{font-size:17px;font-weight:700;margin-bottom:4px}
.info .m{font-size:13px;color:var(--ink-soft);line-height:1.6}
.info .tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;color:#fff;margin-right:6px}
@media (max-width:700px){
  h1{font-size:17px;width:100%}
  .hint,.legend{display:none}
  .decks{flex-direction:row;flex-wrap:wrap;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));top:auto;
    bottom:calc(150px + env(safe-area-inset-bottom,0px))}
  .decks button{min-width:0;padding:5px 8px}
}
</style>
</head>
<body>

<div id="stage"></div>
<div id="labels"></div>
<div id="tip" hidden></div>

<div class="bar">
  <a class="back" id="back" href="./">← 導覽</a>
  <h1>探索星號 3D 甲板</h1>
  <div class="grp">
    <button id="t-cores" aria-pressed="false">樓梯・電梯</button>
    <button id="t-explode" aria-pressed="true">分層展開</button>
    <button id="t-labels" aria-pressed="true">標籤</button>
    <button id="t-spin" aria-pressed="false">自動旋轉</button>
    <button id="t-reset">重設視角</button>
  </div>
  <span class="hint">拖曳旋轉・滾輪/雙指縮放・右鍵拖曳平移・滑鼠移到區域上顯示名稱</span>
</div>

<nav class="decks" id="decks" aria-label="選擇甲板"></nav>

<details class="legend" open>
  <summary>圖例</summary>
  <div class="g">
    <b>公共區域（牆頂色帶）</b>
    <span class="sw"><i style="background:#e07a3f"></i>餐飲</span>
    <span class="sw"><i style="background:#2f9c95"></i>娛樂</span>
    <span class="sw"><i style="background:#f2b134"></i>親子</span>
    <span class="sw"><i style="background:#a77bca"></i>美容及健身</span>
    <span class="sw"><i style="background:#5a9e4b"></i>運動</span>
    <span class="sw"><i style="background:#3aa7e0"></i>水上活動</span>
    <span class="sw"><i style="background:#d1607f"></i>零售</span>
    <span class="sw"><i style="background:#9aa4ae"></i>設施・服務</span>
    <span class="sw"><i style="background:#e8a400"></i>樓梯</span>
    <span class="sw"><i style="background:#1e88e5"></i>電梯</span>
    <b>客房（床罩與地毯顏色）</b>
    <span class="sw"><i style="background:#b89a52"></i>皇宮庭苑別墅</span>
    <span class="sw"><i style="background:#79c4c4"></i>皇宮豪華套房</span>
    <span class="sw"><i style="background:#c5d89a"></i>皇宮套房</span>
    <span class="sw"><i style="background:#9b4d9b"></i>露台客房</span>
    <span class="sw"><i style="background:#23305a"></i>海景客房</span>
    <span class="sw"><i style="background:#4f93cf"></i>內側客房</span>
    <span class="sw"><i style="background:#a0582e"></i>無障礙內側客房</span>
  </div>
  <p class="src">依官方台灣出發版手冊甲板圖製作的示意模型，非比例尺；<br>實際動線以船上指示牌為準。</p>
</details>

<div class="info" id="info">
  <div class="t" id="info-t">探索星號 4–13 層</div>
  <div class="m" id="info-m">選一層甲板可單獨查看並顯示設施名稱；按「樓梯・電梯」可標出各層樓梯與電梯位置。</div>
</div>

<script src="vendor/three/three.min.js"></script>
<script src="vendor/three/OrbitControls.js"></script>
<script>
(function(){
/* ---------- plan → world mapping, one entry per deck (plan pixel coords from the brochure pages) ---------- */
const DK = {
  13:{S:.1034,cx:225,ys:1440}, 12:{S:.1034,cx:620,ys:1440}, 11:{S:.1034,cx:1015,ys:1440},
  10:{S:.106,cx:206,ys:1365},  9:{S:.106,cx:566,ys:1365},   8:{S:.106,cx:925,ys:1365},
   7:{S:.106,cx:205,ys:1365},  6:{S:.106,cx:566,ys:1365},   5:{S:.106,cx:925,ys:1362},
   4:{S:.106,cx:205,ys:1362}
};
const DECK_LIST = [13,12,11,10,9,8,7,6,5,4];
/* 各層說明＝手冊第 7–10 頁甲板圖下方的圖說 */
const DECK_DESC = {
  13:'綜合運動場、餐廳及酒吧', 12:'水上活動、水療中心、健身中心、沙龍、酒廊、動感地帶及 VR 探索館',
  11:'皇宮、套房、露台及內側客房', 10:'皇宮、雲頂俱樂部、套房、露台及內側客房',
  9:'套房、露台及內側客房', 8:'餐廳、精品店、海景及內側客房', 7:'大廳、劇院、餐廳及咖啡座',
  6:'餐廳、海景及內側客房', 5:'海景及內側客房', 4:'海景、內側客房、醫務室'
};
const wx = (d,x) => (x - DK[d].cx) * DK[d].S;
const wz = (d,y) => (y - DK[d].ys) * DK[d].S + 60;

const CAT = {
  dining:{c:0xe07a3f,n:'餐飲'}, fun:{c:0x2f9c95,n:'娛樂'}, kids:{c:0xf2b134,n:'親子'},
  well:{c:0xa77bca,n:'美容及健身'}, sport:{c:0x5a9e4b,n:'運動及康樂'}, water:{c:0x3aa7e0,n:'水上活動'},
  shop:{c:0xd1607f,n:'零售'}, svc:{c:0x9aa4ae,n:'設施・服務'}, deck:{c:0xd9c6a0,n:'戶外甲板'},
  crew:{c:0x6d7f93,n:'船員區域'}, med:{c:0xd64545,n:'醫療'}, boat:{c:0xf08a24,n:'救生艇'},
  stairs:{c:0xe8a400,n:'樓梯'}, lift:{c:0x1e88e5,n:'電梯'},
  villa:{c:0xb89a52,n:'皇宮庭苑別墅'}, dlx:{c:0x79c4c4,n:'皇宮豪華套房'}, psuite:{c:0xc5d89a,n:'皇宮套房'},
  bal:{c:0x9b4d9b,n:'露台客房'}, ocean:{c:0x23305a,n:'海景客房'},
  ins:{c:0x4f93cf,n:'內側客房'}, acc:{c:0xa0582e,n:'無障礙內側客房'}
};
const CABIN_CATS = new Set(['villa','dlx','psuite','bal','ocean','ins','acc']);

/* ---------- canvas textures ---------- */
function canvasTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c); t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=4; return t;
}
const woodTex = canvasTex(256,256,(x,w,h)=>{
  for(let i=0;i<16;i++){
    const l = 58 + ((i*37)%11) - 5;
    x.fillStyle = `hsl(32,38%,${l}%)`; x.fillRect(0,i*16,w,16);
    x.fillStyle = 'rgba(60,40,20,.35)'; x.fillRect(0,i*16+15,w,1);
    const off = (i*73)%256; x.fillRect(off,i*16,1,16); x.fillRect((off+128)%256,i*16,1,16);
  }
});
woodTex.repeat.set(0.22,0.22);
const carpetTex = canvasTex(64,64,(x,w,h)=>{
  x.fillStyle='#d8d2c7'; x.fillRect(0,0,w,h);
  for(let i=0;i<500;i++){ x.fillStyle=`rgba(90,80,70,${Math.random()*.08})`; x.fillRect(Math.random()*w,Math.random()*h,1,1); }
});
carpetTex.repeat.set(0.3,0.3);
function windowTex(style){
  return canvasTex(128,64,(x,w,h)=>{
    x.fillStyle='#f5f7f9'; x.fillRect(0,0,w,h);
    if(style==='balcony'){
      x.fillStyle='#2b4a66'; x.fillRect(6,6,w-12,h-12);
      x.fillStyle='rgba(190,220,240,.55)'; x.fillRect(6,h*0.55,w-12,h*0.45-6);
      x.fillStyle='#f5f7f9'; x.fillRect(w-7,0,7,h); x.fillRect(0,0,7,h);
    } else if(style==='public'){
      const g=x.createLinearGradient(0,10,0,h-12); g.addColorStop(0,'#3d6788'); g.addColorStop(1,'#1d3a55');
      x.fillStyle=g; x.fillRect(0,12,w,h-24);
      x.fillStyle='#e3e8ec'; x.fillRect(w-3,12,3,h-24);
    } else {
      const g=x.createLinearGradient(0,14,0,44); g.addColorStop(0,'#46739a'); g.addColorStop(1,'#1f3d5a');
      x.fillStyle=g; x.fillRect(22,16,w-44,28);
    }
  });
}
const WIN = {cabin:windowTex('cabin'), balcony:windowTex('balcony'), public:windowTex('public')};
const waterTex = canvasTex(128,128,(x,w,h)=>{
  x.fillStyle='#3aa7e0'; x.fillRect(0,0,w,h);
  x.strokeStyle='rgba(255,255,255,.35)'; x.lineWidth=2;
  for(let i=0;i<14;i++){ x.beginPath(); const y=Math.random()*h; x.moveTo(0,y);
    for(let k=0;k<=8;k++) x.lineTo(k*16, y+Math.sin(k+i)*5); x.stroke(); }
});
waterTex.repeat.set(2,2);
const courtTex = canvasTex(256,512,(x,w,h)=>{
  x.fillStyle='#3f8a4a'; x.fillRect(0,0,w,h);
  x.fillStyle='#2f6fa8'; x.fillRect(20,20,w-40,h-40);
  x.strokeStyle='#fff'; x.lineWidth=5; x.strokeRect(20,20,w-40,h-40);
  x.beginPath(); x.moveTo(20,h/2); x.lineTo(w-20,h/2); x.stroke();
  x.beginPath(); x.arc(w/2,h/2,40,0,Math.PI*2); x.stroke();
  x.beginPath(); x.arc(w/2,20,70,0,Math.PI); x.stroke();
  x.beginPath(); x.arc(w/2,h-20,70,Math.PI,0); x.stroke();
});
const trackTex = canvasTex(64,64,(x,w,h)=>{
  x.fillStyle='#b5523b'; x.fillRect(0,0,w,h);
  x.fillStyle='#fff'; x.fillRect(0,0,3,h); x.fillRect(w/2-1,0,2,h); x.fillRect(w-3,0,3,h);
});

/* ---------- renderer / scene ---------- */
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xcfdde6);
scene.fog = new THREE.Fog(0xcfdde6, 380, 800);

const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 1500);
const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI*0.49;
controls.minDistance = 12; controls.maxDistance = 520;
controls.autoRotateSpeed = 0.8;

scene.add(new THREE.HemisphereLight(0xffffff, 0x8aa3b5, 0.8));
const sun = new THREE.DirectionalLight(0xfff6e8, 0.85);
sun.position.set(70,200,50);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.bias = -0.0005;
Object.assign(sun.shadow.camera,{left:-90,right:90,top:90,bottom:-90,near:10,far:400});
scene.add(sun);

const sea = new THREE.Mesh(new THREE.CircleGeometry(900,64), new THREE.MeshStandardMaterial({color:0x8fb2c6,roughness:.6,metalness:.1}));
sea.rotation.x = -Math.PI/2; sea.position.y = -16; sea.receiveShadow = true;
scene.add(sea);

const decks = {};
DECK_LIST.forEach(d=>{ decks[d] = new THREE.Group(); scene.add(decks[d]); });
const pickMeshes = [], labels = [], allInfos = [];
const labelBox = document.getElementById('labels');

function addLabel(text, deck, x, y, z, cls){
  const el = document.createElement('div');
  el.className = 'lb' + (cls ? ' '+cls : '');
  el.textContent = text;
  el.hidden = true;
  labelBox.appendChild(el);
  labels.push({el, deck, p:new THREE.Vector3(x,y,z), kind:(cls||'area').split(' ')[0]});
}
function mat(color, o={}){
  return new THREE.MeshStandardMaterial(Object.assign({color, roughness:.75}, o));
}
function info(d, name, cat, note){
  const i = {deck:d, name, cat, note, refs:[]}; allInfos.push(i); return i;
}

/* ---------- instanced builder: every small part goes into one InstancedMesh per deck+kind ---------- */
const GEO = {
  box:new THREE.BoxGeometry(1,1,1), cyl:new THREE.CylinderGeometry(.5,.5,1,20),
  sph:new THREE.SphereGeometry(.5,18,12), cone:new THREE.ConeGeometry(.5,1,18)
};
const KIND = {
  box:{g:'box'}, cyl:{g:'cyl'}, sph:{g:'sph'}, cone:{g:'cone'},
  metal:{g:'box', m:{metalness:.6, roughness:.3}}, mcyl:{g:'cyl', m:{metalness:.6, roughness:.3}},
  glass:{g:'box', m:{roughness:.05, metalness:.1, transparent:true, opacity:.32}, op:.32, noShadow:true},
  water:{g:'box', m:{map:waterTex, roughness:.1, metalness:.1, transparent:true, opacity:.88}, op:.88},
  wcyl:{g:'cyl', m:{map:waterTex, roughness:.1, metalness:.1, transparent:true, opacity:.88}, op:.88},
  wood:{g:'box', m:{map:woodTex, roughness:.8}}
};
const BUF = {};
const _q = new THREE.Quaternion(), _e = new THREE.Euler(), _p = new THREE.Vector3(), _s = new THREE.Vector3();
/* put: y is the bottom of the part */
function put(d, kind, x, y, z, sx, sy, sz, color, inf, rot){
  const key = d+'|'+kind;
  (BUF[key] = BUF[key] || {d, kind, items:[]}).items.push({x,y,z,sx,sy,sz,color,inf,rot});
}
function finalize(){
  Object.values(BUF).forEach(b=>{
    const K = KIND[b.kind];
    const material = mat(0xffffff, K.m || {});
    const mesh = new THREE.InstancedMesh(GEO[K.g], material, b.items.length);
    const M = new THREE.Matrix4();
    mesh.userData = {deck:b.d, baseOpacity:K.op ?? 1, infos:[]};
    b.items.forEach((it,i)=>{
      _e.set(...(it.rot || [0,0,0])); _q.setFromEuler(_e);
      _p.set(it.x, it.y + it.sy/2, it.z); _s.set(it.sx, it.sy, it.sz);
      M.compose(_p,_q,_s); mesh.setMatrixAt(i, M);
      const c = new THREE.Color(it.color); mesh.setColorAt(i, c);
      mesh.userData.infos[i] = it.inf || null;
      if(it.inf) it.inf.refs.push({m:mesh, i, c});
    });
    mesh.instanceMatrix.needsUpdate = true;
    if(mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
    mesh.castShadow = !K.noShadow; mesh.receiveShadow = true;
    decks[b.d].add(mesh);
    if(mesh.userData.infos.some(Boolean)) pickMeshes.push(mesh);
  });
}
/* single (non-instanced) meshes that can still be hovered */
function single(d, mesh, inf, op=1){
  mesh.castShadow = mesh.receiveShadow = true;
  mesh.userData = {deck:d, baseOpacity:op, info:inf};
  decks[d].add(mesh);
  if(inf){ inf.refs.push({m:mesh, i:-1}); pickMeshes.push(mesh); }
  return mesh;
}

/* world rectangle from plan pixels */
function R(d,x0,y0,x1,y1){
  const a=wx(d,x0), b=wx(d,x1), c=wz(d,y0), e=wz(d,y1);
  const r = {x0:Math.min(a,b), x1:Math.max(a,b), z0:Math.min(c,e), z1:Math.max(c,e)};
  r.w = r.x1-r.x0; r.dz = r.z1-r.z0; r.cx = (r.x0+r.x1)/2; r.cz = (r.z0+r.z1)/2;
  return r;
}
function sub(r, x0,z0,x1,z1){ // fractional sub-rectangle

function sternArc(cx, half, yBot, r){
  const out=[]; for(let i=0;i<=6;i++){ const a=i/6*Math.PI/2; out.push([cx+half-r+r*Math.cos(a), yBot-r+r*Math.sin(a)]); }

}
function closeSym(cx, Rr){
  const last = Rr[Rr.length-1]; Rr.push([cx,last[1]]);
  const L = Rr.slice(1,-1).map(([x,y])=>[2*cx-x,y]).reverse();
  return Rr.concat(L);
}
function roundedOutline(cx, half, yTop, yBot, rT, rB){
  const Rr=[[cx,yTop]];
  for(let i=0;i<=6;i++){ const a=-Math.PI/2+i/6*Math.PI/2; Rr.push([cx+half-rT+rT*Math.cos(a), yTop+rT+rT*Math.sin(a)]); }
  return closeSym(cx, Rr.concat(sternArc(cx,half,yBot,rB)));
}
function pointedOutline(cx, half, yTip, yFull, yBot, rB, inset){
  const Rr=[];
  for(let i=0;i<=16;i++){ const t=i/16; Rr.push([cx+half*(1-Math.pow(1-t,2.2)), yTip+(yFull-yTip)*t]); }
  if(inset){ const [a,b,dx]=inset; Rr.push([cx+half,a-8],[cx+half-dx,a],[cx+half-dx,b],[cx+half,b+8]); }
  return closeSym(cx, Rr.concat(sternArc(cx,half,yBot,rB)));
}

/* perimeter wall strip with a repeating window texture (or a glass railing) */
function perimeter(d, h, style){

    const v=pos.length/3;
    pos.push(a[0],0,a[1], b[0],0,b[1], b[0],h,b[1], a[0],h,a[1]);
    uv.push(acc/rep,0, (acc+len)/rep,0, (acc+len)/rep,1, acc/rep,1);

function setOpacity(group, f){
  group.traverse(o=>{
    if(!o.material) return;
    const base = o.userData.baseOpacity ?? 1;
    (Array.isArray(o.material)?o.material:[o.material]).forEach(m=>{
      const v = base*f; m.opacity = v; m.transparent = v < 1; m.depthWrite = v > 0.5;
    });
    o.visible = f > 0.02;
  });
}

/* hover / selection / core highlight colouring */
let hovered = null, selected = null;
const WHITE_C = new THREE.Color(0xffffff);
const CORE_HL = {stairs:new THREE.Color(0xffb000), lift:new THREE.Color(0x1e88e5)};
function paint(inf){
  const on = inf===hovered || inf===selected;
  const hl = showCores && CORE_HL[inf.cat];
  inf.refs.forEach(ref=>{
    if(ref.i < 0){
      (Array.isArray(ref.m.material)?ref.m.material:[ref.m.material]).forEach(x=>x.emissive && x.emissive.setHex(on?0x444444:0));
      return;
    }
    let c = hl ? ref.c.clone().lerp(hl,.75) : ref.c;
    if(on) c = c.clone().lerp(WHITE_C,.45);
    ref.m.setColorAt(ref.i, c); ref.m.instanceColor.needsUpdate = true;
  });
}

/* 直式螢幕（手機）水平視角很窄，鏡頭位置要依畫面比例調整，否則船頭船尾會出畫面 */
const portrait = () => camera.aspect < 1;
const narrow = () => Math.max(1, 0.62 / camera.aspect);   // 比 0.62 更窄（手機直放約 0.46）就按比例拉遠
function homeView(){
  const top = deckY(13), k = narrow();
  return {target:new THREE.Vector3(0, top*0.45, 0), pos:new THREE.Vector3(150*k, top*0.45+110*k, 170*k)};
}
/* 單層：橫式從斜側面看；直式改從船尾後上方看，船身沿畫面上下延伸（船頭朝上，與平面圖同向） */
function deckView(ty){
  if(!portrait()) return {target:new THREE.Vector3(0, ty, 0), pos:new THREE.Vector3(60, ty+75, 85)};
  const D = 245 * narrow(), z = 6;   // z 略偏船尾：畫面下方有甲板列與資訊卡，船身往上移
  return {target:new THREE.Vector3(0, ty, z), pos:new THREE.Vector3(D*0.1, ty+D*0.85, z+D*0.52)};
}

  if(d==='all'){

const ray = new THREE.Raycaster(), mouse = new THREE.Vector2();
const tip = document.getElementById('tip');
let downAt = null;
function hit(ev){
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((ev.clientX-r.left)/r.width)*2-1, -((ev.clientY-r.top)/r.height)*2+1);
  ray.setFromCamera(mouse, camera);
  const cand = pickMeshes.filter(m=>fade[m.userData.deck] > 0.5);
  for(const h of ray.intersectObjects(cand,false)){
    const u = h.object.userData;
    const inf = h.instanceId != null && u.infos ? u.infos[h.instanceId] : u.info;
    if(inf) return inf;
  }
  return null;
}
function describe(inf){
  return CABIN_CATS.has(inf.cat) ? `${inf.deck}層・客房` : `${inf.deck}層・${CAT[inf.cat].n}`;
}
renderer.domElement.addEventListener('pointermove',ev=>{
  if(ev.pointerType!=='mouse') return;
  if(ev.buttons){ tip.hidden = true; return; }
  const inf = hit(ev);
  if(inf!==hovered){ const old=hovered; hovered=inf; if(old) paint(old); if(inf) paint(inf); }
  renderer.domElement.style.cursor = inf ? 'pointer' : '';
  if(!inf){ tip.hidden = true; return; }
  tip.innerHTML = '';
  tip.appendChild(document.createTextNode(inf.name));
  const s = document.createElement('small'); s.textContent = describe(inf); tip.appendChild(s);
  tip.hidden = false;
  const tw = tip.offsetWidth;
  tip.style.left = Math.min(ev.clientX + 14, innerWidth - tw - 8) + 'px';
  tip.style.top = (ev.clientY + 16) + 'px';
});
renderer.domElement.addEventListener('pointerleave',()=>{ tip.hidden = true; if(hovered){ const o=hovered; hovered=null; paint(o); } });
renderer.domElement.addEventListener('pointerdown',ev=>{ downAt=[ev.clientX,ev.clientY]; });
renderer.domElement.addEventListener('pointerup',ev=>{
  if(!downAt || Math.hypot(ev.clientX-downAt[0],ev.clientY-downAt[1])>5) return;
  const inf = hit(ev);
  const old = selected; selected = inf; if(old) paint(old);
  if(!inf) return;
  paint(inf);
  const c = CAT[inf.cat];
  infoT.textContent = inf.name;
  infoM.innerHTML = '';
  const t = document.createElement('span'); t.className='tag';
  t.style.background = '#'+c.c.toString(16).padStart(6,'0'); t.textContent = c.n;
  infoM.appendChild(t);
  infoM.appendChild(document.createTextNode(inf.deck+'層甲板' + (inf.note ? '・' + inf.note : '') + '　'));
  infoM.appendChild(guideLink(inf.deck));
});

/* ---------- loop ---------- */
let wasPortrait = null;
function resize(){
  renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  /* 手機轉向（直↔橫）時重新取景 */
  if(wasPortrait !== null && wasPortrait !== portrait()) setFocus(focus);
  wasPortrait = portrait();
}
addEventListener('resize',resize); resize();
const h0 = homeView(); camera.position.copy(h0.pos); controls.target.copy(h0.target);
/* deck3d.html#10 → 直接聚焦該層（從導覽的 Deck 平面圖連過來） */
const h1 = location.hash.slice(1);
if(DECK_LIST.includes(+h1)) setFocus(String(+h1));

const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
const v = new THREE.Vector3();
controls.addEventListener('start',()=>{ camGoal.target=null; camGoal.pos=null; tip.hidden = true; });

function tick(t){
  requestAnimationFrame(tick);
  const k = reduce ? 1 : 0.1;
  if(!reduce) waterTex.offset.set((t||0)*0.00002, (t||0)*0.00004);
  DECK_LIST.forEach(d=>{
    const g = decks[d];
    g.position.y += (deckY(d) - g.position.y) * k;
    const goal = focus==='all' ? 1 : (String(d)===focus ? 1 : (d > +focus ? 0 : 0.08));
    if(Math.abs(fade[d]-goal) > 0.003){ fade[d] += (goal-fade[d])*k; setOpacity(g, fade[d]); }
  });
  if(camGoal.target){
    controls.target.lerp(camGoal.target, k);
    if(camGoal.pos) camera.position.lerp(camGoal.pos, k);
    if(controls.target.distanceTo(camGoal.target) < 0.05 && (!camGoal.pos || camera.position.distanceTo(camGoal.pos) < 0.1)){
      camGoal.target = null; camGoal.pos = null;
    }
  }
  controls.update();
  renderer.render(scene,camera);
  const w = innerWidth, h = innerHeight;
  labels.forEach(L=>{
    let show = showLabels && fade[L.deck] > 0.6;
    if(show){
      if(L.kind==='deck' || L.kind==='bow') show = focus==='all';
      else if(L.kind==='core') show = focus===String(L.deck) || (showCores && focus==='all');
      else show = focus===String(L.deck);
    }
    if(!show){ L.el.hidden = true; return; }
    v.copy(L.p); v.y += decks[L.deck].position.y; v.project(camera);
    if(v.z > 1){ L.el.hidden = true; return; }
    L.el.hidden = false;
    L.el.style.left = ((v.x+1)/2*w) + 'px';
    L.el.style.top = ((1-v.y)/2*h) + 'px';
  });
}
requestAnimationFrame(tick);
})();
</script>
